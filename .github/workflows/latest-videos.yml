name: Latest videos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node .github/scripts/latest-videos.mjs
      - name: Commit when the list changed
        run: |
          if git diff --quiet -- assets/data/videos.json; then exit 0; fi
          git config user.name 'Joemet123'
          git config user.email '92001883+Joemet123@users.noreply.github.com'
          git add assets/data/videos.json
          git commit -m 'Update latest videos'
          git pull --rebase origin main
          git push origin HEAD:main
